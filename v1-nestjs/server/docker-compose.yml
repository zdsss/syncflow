services:
  postgres:
    image: postgres:16-alpine
    container_name: syncflow-db
    environment:
      POSTGRES_DB: syncflow
      POSTGRES_USER: syncflow
      POSTGRES_PASSWORD: syncflow123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
