# =============================================================================
# SyncFlow nginx reverse proxy
# Installed to: /etc/nginx/sites-available/syncflow
# =============================================================================
# Architecture: Nginx → Next.js (:3000) → Spring Boot (:8088)
# Next.js handles SSR + API routes (which proxy to Spring Boot internally)

limit_req_zone $binary_remote_addr zone=syncflow_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=syncflow_login:10m rate=5r/m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    # Upload limit
    client_max_body_size 200m;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ---- Frontend: proxy to Next.js ----
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    # ---- Next.js HMR WebSocket (dev only, remove in production) ----
    location /_next/webpack-hmr {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # ---- Backend WebSocket (STOMP) ----
    location /ws {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # ---- Login rate limiting ----
    location /api/auth/login {
        limit_req zone=syncflow_login burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---- Health check (direct to backend) ----
    location /api/health {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        access_log off;
    }
}
