name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Security audit
        run: npm audit --audit-level=high || true

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: syncflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npx prisma migrate deploy
        working-directory: server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/syncflow_test
      - run: npx jest --coverage
        working-directory: server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/syncflow_test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test-frontend, test-backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  docker-build:
    name: Docker Build
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build frontend Docker image
        run: docker build -t syncflow-frontend .
      - name: Build backend Docker image
        run: docker build -t syncflow-backend ./server

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: syncflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: server
      - run: npx prisma migrate deploy
        working-directory: server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/syncflow_test
      - run: npx prisma db seed
        working-directory: server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/syncflow_test
      - run: npx playwright install --with-deps chromium
      - name: Start backend
        run: cd server && npx ts-node src/main.ts &
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/syncflow_test
          PORT: 3000
          JWT_SECRET: test-secret
      - name: Start frontend
        run: npm run dev &
        env:
          VITE_API_URL: http://localhost:3000/api
          VITE_SOCKET_URL: http://localhost:3000
      - name: Wait for servers
        run: npx wait-on http://localhost:5173 http://localhost:3000/api/docs -t 60000
      - name: Run E2E tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
