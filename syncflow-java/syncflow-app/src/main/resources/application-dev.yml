server:
  port: 8088

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/syncflow
    username: syncflow
    password: syncflow123
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: localhost
      port: 6379

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: syncflow

flowable:
  async-executor-enabled: false
  job-executor-enabled: false
  idm:
    enabled: false
  database-schema-update: true
  check-process-definitions: true
  process-definition-location-prefix: classpath*:/processes/
  history-level: audit

logging:
  level:
    com.syncflow: DEBUG
    org.flowable: INFO
