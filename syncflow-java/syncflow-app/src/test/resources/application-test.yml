spring:
  datasource:
    url: jdbc:h2:mem:syncflow_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: false

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  # Use simple in-memory cache (ConcurrentHashMap) instead of Redis
  cache:
    type: simple

  # Disable Redis and Flowable auto-configuration
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.flowable.spring.boot.app.SpringAppEngineAutoConfiguration
      - org.flowable.spring.boot.app.AppEngineAutoConfiguration
      - org.flowable.spring.boot.app.AppEngineServicesAutoConfiguration
      - org.flowable.spring.boot.ProcessEngineAutoConfiguration
      - org.flowable.spring.boot.ProcessEngineServicesAutoConfiguration
      - org.flowable.spring.boot.FlowableAutoConfiguration
      - org.flowable.spring.boot.FlowableRestAutoConfiguration
      - org.flowable.spring.boot.idm.IdmEngineAutoConfiguration
      - org.flowable.spring.boot.idm.IdmEngineServicesAutoConfiguration
      - org.flowable.spring.boot.cmmn.CmmnEngineAutoConfiguration
      - org.flowable.spring.boot.cmmn.CmmnEngineServicesAutoConfiguration
      - org.flowable.spring.boot.dmn.DmnEngineAutoConfiguration
      - org.flowable.spring.boot.dmn.DmnEngineServicesAutoConfiguration
      - org.flowable.spring.boot.eventregistry.EventRegistryAutoConfiguration
      - org.flowable.spring.boot.eventregistry.EventRegistryServicesAutoConfiguration

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# Flowable — keep engine enabled for bean wiring, but skip schema management
# (Flowable's internal DDL scripts are incompatible with H2 2.x)
flowable:
  async-executor-enabled: false
  job-executor-enabled: false
  idm:
    enabled: false
  database-schema-update: skip-schema-validation
  check-process-definitions: false
  history-level: audit
  process:
    definition-cache-limit: -1
  event-logging-enabled: false

# JWT for tests
jwt:
  secret: test-secret-key-that-is-long-enough-for-hs256-algorithm-minimum-256-bits
  expiration: 900000
  refresh-expiration: 604800000

# MinIO — keep defaults (MinioClient bean is just a builder, no connection on init)
minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: syncflow

logging:
  level:
    com.syncflow: DEBUG
    org.springframework: WARN
    org.flowable: WARN
    org.apache.ibatis: WARN
